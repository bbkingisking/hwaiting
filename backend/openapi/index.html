<!doctype html>
<html>
  <head>
    <title>Hwaiting backend API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi.json',
        servers: [
          { url: 'http://localhost:15000', description: 'Local' },
        ],
      })
    </script>
  </body>
</html>
